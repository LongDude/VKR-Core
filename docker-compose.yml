services:
  vkr-database:
    image: postgres:18-alpine3.22
    container_name: vkr-database
    env_file: ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkr-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gresP0st}
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-vkr-db} -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - vkr-inner-network
      - vkr-outer-network
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - ./database/conf/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G


  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: vkr-pgadmin
    env_file: ./.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@mail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-5678pgadmin}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - vkr-inner-network
      - vkr-outer-network
    ports:
      - 8081:80
    depends_on:
      - vkr-database
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 8G
  
# TODO: Add flyway-cli configuration for manual flyway CLI access
  flyway-migrate:
    image: flyway/flyway:9.0.0
    container_name: vkr-flyway_migrations
    command: migrate
    volumes:
      - ./database/migrations:/flyway/sql
    networks:
      - vkr-inner-network
    depends_on:
      - vkr-database
    environment:
      FLYWAY_URL: jdbc:postgresql://vkr-database:5432/${POSTGRES_DB:-vkr-db}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-gresP0st}
    profiles: [migrate]




networks:
  vkr-inner-network:
    name: vkr-scinside-internal
    driver: bridge
    internal: true
  vkr-outer-network:
    name: vkr-scinside-external
    driver: bridge
    internal: false


volumes:
  pgadmin:
    name: "vkr-volume-pgadmin"
  db_data:
    name: "vkr-volume-db" 
